<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oracle Bottleneck Monitor</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>Oracle Bottleneck Monitor</h1>
    <div class="header-right">
      <select id="dbSelect" title="Switch database"></select>
      <span id="lastUpdate"></span>
      <button id="refreshBtn">Refresh</button>
    </div>
  </header>

  <nav id="tabs">
    <button data-section="health" class="active">Overview</button>
    <button data-section="sessions">Sessions</button>
    <button data-section="locks">Locks</button>
    <button data-section="topSql">Top SQL</button>
    <button data-section="waits">Waits</button>
    <button data-section="resources">Resources</button>
    <button data-section="ash">ASH (30 min)</button>
  </nav>

  <main>
    <div id="content"><p class="loading">Loading...</p></div>
    <div id="hint" class="hint"></div>
    <div id="chartContainer" style="display:none; max-width:600px; margin:1.5rem auto;">
      <canvas id="chart"></canvas>
    </div>
  </main>

  <!-- Modal for explain plan -->
  <div id="modal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h3>Execution Plan</h3>
      <pre id="planText"></pre>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
